# PURSUE OS System Users & Groups (systemd-sysusers)
# Type Name ID GECOS Home Shell

# System group for investigator privilege separation
g pursue-investigator - -

# System daemon user for background services (runtime, in-process handlers)
u pursue - "PURSUE OS System Daemon" /var/lib/pursue /usr/sbin/nologin
m pursue pursue-investigator

# Interactive investigator user for the desktop session (Decision A-008)
u pursue-investigator 1001 "PURSUE OS Investigator" /home/pursue-investigator /bin/bash
