# PURSUE OS — Rust workspace root
#
# Foundation workspace for core/evidence components.
# See docs/development/REPOSITORY_STRUCTURE.md and docs/core/DECISION_RECORD.md.

[workspace]
resolver = "2"
members = [
    "crates/pursue-core",
    "crates/pursue-evidence",
    "crates/pursue-case",
    "crates/pursue-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["P4inz <atharva.patil.cg@gmail.com>"]
repository = "https://github.com/p4inz-code/pursue-os"
description = "PURSUE OS — investigation-focused Linux operating system (foundation crates)"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
